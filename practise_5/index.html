<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Авторизация</title>
  <style>
    :root {
      --carbon: #15151e;
      --panel: #1f1f2a;
      --field: #12121a;
      --red: #e10600;
      --white: #ffffff;
      --muted: #949498;
      --line: #38383f;
      --ok: #00d26a;
      --err: #ff4d4d;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background:
        repeating-linear-gradient(115deg, rgba(255,255,255,.025) 0 2px, transparent 2px 14px),
        var(--carbon);
      font-family: "Titillium Web", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
      color: var(--white);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
    }
    /* шахматный финишный флаг внизу страницы */
    body::after {
      content: "";
      position: fixed;
      left: 0; right: 0; bottom: 0;
      height: 24px;
      background: repeating-conic-gradient(#fff 0 25%, #15151e 0 50%) 0 0 / 24px 24px;
      opacity: .9;
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: var(--panel);
      border-left: 6px solid var(--red);
      border-radius: 0 12px 0 12px;
      padding: 30px 28px 28px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, .6);
      position: relative;
    }
    /* пять стартовых огней */
    .card::before {
      content: "";
      display: block;
      width: 160px;
      height: 22px;
      margin-bottom: 18px;
      background: radial-gradient(circle at 11px 11px, var(--red) 0 8px, #3a0a0a 9px 10px, transparent 11px) 0 0 / 32px 22px repeat-x;
      filter: drop-shadow(0 0 5px rgba(225, 6, 0, .7));
    }
    h1 {
      margin: 0 0 4px;
      font-size: 32px;
      font-weight: 700;
      font-style: italic;
      text-transform: uppercase;
      letter-spacing: .5px;
      line-height: 1.05;
    }
    .sub {
      margin: 0 0 26px;
      color: var(--muted);
      font-size: 15px;
      padding-bottom: 14px;
      border-bottom: 2px solid var(--red);
    }
    label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      font-style: italic;
      margin-bottom: 6px;
      color: var(--white);
    }
    input {
      width: 100%;
      padding: 12px 14px;
      margin-bottom: 18px;
      border: 1px solid var(--line);
      border-bottom: 3px solid var(--line);
      border-radius: 0;
      background: var(--field);
      font: inherit;
      font-size: 17px;
      color: var(--white);
      transition: border-color .15s;
    }
    input:focus {
      border-bottom-color: var(--red);
      outline: none;
    }
    button {
      width: 100%;
      padding: 14px;
      border: 0;
      background: var(--red);
      color: var(--white);
      font: inherit;
      font-size: 18px;
      font-weight: 700;
      font-style: italic;
      text-transform: uppercase;
      letter-spacing: 1px;
      cursor: pointer;
      clip-path: polygon(0 0, 100% 0, 100% 62%, calc(100% - 16px) 100%, 0 100%);
      transition: background .15s, transform .1s;
    }
    button:hover { background: #ff1a10; }
    button:active { transform: translateY(1px); }
    input:focus-visible, button:focus-visible {
      outline: 3px solid var(--white);
      outline-offset: 2px;
    }
    .msg {
      margin-top: 20px;
      padding: 13px 16px;
      font-size: 16px;
      font-weight: 600;
      display: none;
      background: var(--field);
    }
    .msg.ok  { display: block; color: var(--ok);  border-left: 5px solid var(--ok);  box-shadow: 0 0 18px rgba(0, 210, 106, .18); }
    .msg.err { display: block; color: var(--err); border-left: 5px solid var(--err); box-shadow: 0 0 18px rgba(255, 77, 77, .18); }
    .hint {
      margin-top: 22px;
      padding-bottom: 14px;
      font-size: 13px;
      color: var(--muted);
    }
    .hint b { color: var(--white); }
    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Вход в систему</h1>
    <p class="sub">Введите логин и пароль</p>

    <form id="loginForm" autocomplete="off">
      <label for="login">Логин</label>
      <input id="login" type="text" required>

      <label for="password">Пароль</label>
      <input id="password" type="password" required>

      <button type="submit">Войти</button>
    </form>

    <div id="message" class="msg" role="status" aria-live="polite"></div>

    <p class="hint">Тестовый вход: login <b>altay</b> / пароль <b>1234</b></p>
  </main>

  <script>
    // Массив пользователей
    const users = [
      { login: "altay",    password: "1234",    name: "Алтай" },
      { login: "temirlan", password: "qwerty",  name: "Темирлан" },
      { login: "zaid",     password: "zaid777", name: "Заид" },
      { login: "aisha",    password: "pass2024", name: "Айша" },
      { login: "bekzat",   password: "bek_pwd", name: "Бекзат" },
      { login: "dana",     password: "dana321", name: "Дана" },
      { login: "ruslan",   password: "rus555",  name: "Руслан" },
      { login: "madina",   password: "mad999",  name: "Мадина" }
    ];

    const form = document.getElementById("loginForm");
    const message = document.getElementById("message");

    form.addEventListener("submit", function (e) {
      e.preventDefault();

      const login = document.getElementById("login").value.trim();
      const password = document.getElementById("password").value;

      // Поиск пользователя методом find
      const user = users.find(function (u) {
        return u.login === login && u.password === password;
      });

      if (user) {
        message.className = "msg ok";
        message.textContent = "Авторизация успешна. Добро пожаловать, " + user.name + "!";
      } else {
        message.className = "msg err";
        message.textContent = "Ошибка: неверный логин или пароль.";
      }
    });
  </script>
</body>
</html>
